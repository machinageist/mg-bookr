[package]
name = "mg-bookr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Ebooks and audiobooks for the Geist suite: library, progress, highlights, mpv audiobooks"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
# reads EPUB package files (small, no unsafe, DOM is fine at OPF size)
roxmltree = "0.20"
# the suite's TUI toolkit (it re-exports crossterm)
ratatui = "0.29"
# the suite's SQLite version
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# EPUB and CBZ are zip files; deflate is all they use
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
